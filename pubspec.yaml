  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  auto_route: ^10.0.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  gap: ^3.0.1
  cloud_firestore: ^5.6.5
  flutter_bloc: ^8.1.6
  freezed: ^3.0.4
  bloc: ^8.1.4
